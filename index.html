<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8f6">
  <meta name="description" content="ICONTEC Construtora">
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <title>ICONTEC Construtora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8f6;
      --surface: #fff;
      --ink: #172b35;
      --muted: #66777d;
      --line: #e3e9e7;
      --accent: #159b8e;
      --accent-dark: #08796f;
      --navy: #102d3b;
      --max: 1160px;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 100px; }
    body { font-family: "DM Sans", sans-serif; color: var(--ink); background: var(--bg); line-height: 1.65; }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .container { width: min(var(--max), calc(100% - 48px)); margin: 0 auto; }
    .topbar { position: fixed; z-index: 20; inset: 14px 0 auto; pointer-events: none; }
    nav {
      pointer-events: auto; width: min(var(--max), calc(100% - 32px)); margin: auto;
      min-height: 66px; padding: 10px 14px 10px 20px; display: flex; align-items: center; gap: 32px;
      background: rgba(255,255,255,.9); border: 1px solid rgba(220,230,226,.9);
      border-radius: 14px; backdrop-filter: blur(16px);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font: 800 19px Manrope,sans-serif; letter-spacing: -.8px; margin-right: auto; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1.5px solid var(--accent); border-radius: 10px; color: var(--accent); font-size: 18px; }
    .brand span:last-child { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .mobile-menu-toggle { display:none; }
    .nav-links a { color: var(--muted); font-size: 14px; font-weight: 600; transition: color .2s; }
    .nav-links a:hover { color: var(--accent-dark); }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 9px; padding: 13px 20px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; transition: background .2s, transform .2s; }
    .button:hover { background: var(--accent-dark); transform: translateY(-2px); }
    .button.outline { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .button.outline:hover { border-color: var(--accent); color: var(--accent-dark); }
    .hero { height: 175vh; min-height: 1100px; padding: 0; overflow: clip; position: relative; }
    .hero-grid { position: sticky; top: 0; min-height: 100vh; padding-top: 100px; padding-bottom: 35px; display: grid; grid-template-columns: 1.08fr .92fr; align-items: center; gap: 64px; }
    .hero-copy-block { position: relative; z-index: 2; }
    .hero-visual { transition: border-radius .2s; }
    .blueprint-tag { position:absolute; top:22px; right:24px; z-index:2; color:#63827d; font:700 10px Manrope,sans-serif; letter-spacing:1.5px; }
    .blueprint-grid { position:absolute; inset:0; opacity:.45; background-image:linear-gradient(rgba(21,155,142,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(21,155,142,.10) 1px,transparent 1px); background-size:28px 28px; mask-image:linear-gradient(135deg,#000,transparent 85%); }
    .house .draw-line { stroke-dasharray:1; stroke-dashoffset:1; }
    .house .draw-fill { opacity:0; transition:opacity .15s; }
    .scroll-caption { position:absolute; bottom:20px; right:24px; z-index:2; color:#63827d; font-size:11px; letter-spacing:.7px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--accent-dark); text-transform: uppercase; letter-spacing: 1.7px; font-size: 11px; font-weight: 800; margin-bottom: 22px; }
    .eyebrow:before { content: ""; width: 26px; height: 1px; background: var(--accent); }
    h1,h2,h3 { font-family: Manrope,sans-serif; letter-spacing: -1.8px; line-height: 1.12; }
    h1 { max-width: 660px; font-size: clamp(48px, 6.2vw, 78px); font-weight: 800; }
    h1 span { color: var(--accent); }
    .hero-copy { max-width: 520px; color: var(--muted); font-size: 17px; margin: 24px 0 30px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero-visual { min-height: 420px; border-radius: 22px; background: #e8f0ed; position: relative; overflow: hidden; display: grid; place-items: center; }
    .hero-visual:before,.hero-visual:after { content:""; position:absolute; border:1px solid rgba(21,155,142,.2); border-radius:50%; }
    .hero-visual:before { width:360px;height:360px; }
    .hero-visual:after { width:270px;height:270px; }
    .house { width: min(76%, 360px); position: relative; z-index: 1; }
    .house path,.house line,.house rect { fill:none; stroke:#147f78; stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; }
    .house .soft { fill:rgba(21,155,142,.1); stroke:none; }
    .visual-label { position:absolute; bottom:22px; left:24px; color:#54716e; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; }
    .section { padding: 105px 0; }
    .section-head { max-width: 700px; }
    .section-head h2 { font-size: clamp(34px, 4.6vw, 54px); font-weight: 800; }
    .section-head > p:last-child { color: var(--muted); margin-top: 18px; max-width: 570px; }
    .services { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:48px; }
    .service { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:27px 23px; min-height:220px; transition:transform .25s,border-color .25s; }
    .service:hover { transform:translateY(-5px); border-color:#a9d6cf; }
    .service-number { color:var(--accent); font:700 12px Manrope,sans-serif; letter-spacing:1px; }
    .service h3 { font-size:21px; margin:28px 0 9px; letter-spacing:-.6px; }
    .service p { color:var(--muted); font-size:14px; }
    .why { background:#eef3f0; }
    .why-grid { display:grid; grid-template-columns:1fr 1fr; gap:70px; align-items:start; }
    .why-list { display:grid; gap:26px; }
    .why-item { border-top:1px solid #d6e1dc; padding-top:18px; }
    .why-item h3 { font-size:19px; letter-spacing:-.5px; margin-bottom:7px; }
    .why-item p { color:var(--muted); font-size:14px; max-width:440px; }
    /* Processo: etapas estáticas e fáceis de percorrer, sem rolagem artificial. */
    .process { padding-top:112px; padding-bottom:120px; }
    .process-heading { display:flex; justify-content:space-between; align-items:end; gap:35px; }
    .process-heading .section-head { max-width:650px; }
    .process-heading .support { max-width:250px; color:var(--muted); font-size:14px; padding-bottom:7px; }
    .process-list { display:grid; grid-template-columns:repeat(5,1fr); gap:0; margin-top:58px; border-top:1px solid var(--line); }
    .process-step { position:relative; padding:26px 19px 0 0; }
    .process-step:not(:last-child):after { content:""; position:absolute; top:-4px; right:14px; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px var(--bg); }
    .step-no { color:var(--accent); font:800 12px Manrope,sans-serif; letter-spacing:1.2px; }
    .process-step h3 { font-size:20px; letter-spacing:-.7px; margin:20px 0 10px; }
    .process-step p { color:var(--muted); font-size:13px; line-height:1.7; min-height:88px; }
    .deliver { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); color:var(--ink); font-size:12px; }
    .deliver b { display:block; color:var(--accent-dark); font-size:11px; text-transform:uppercase; letter-spacing:.8px; margin-bottom:5px; }
    .process-scroll { height:430vh; position:relative; background:#f1f5f2; }
    .process-sticky { position:sticky; top:0; min-height:100vh; display:flex; align-items:center; overflow:hidden; }
    .process-layout { display:grid; grid-template-columns:.85fr 1.15fr; gap:70px; align-items:center; padding-top:95px; padding-bottom:35px; }
    .process-intro { color:var(--muted); margin-top:18px; max-width:440px; font-size:14px; }
    .process-steps { position:relative; min-height:235px; margin-top:34px; }
    .process-detail { position:absolute; inset:0 auto auto 0; max-width:460px; opacity:0; transform:translateY(24px); pointer-events:none; transition:opacity .45s ease,transform .45s ease; }
    .process-detail.active { opacity:1; transform:translateY(0); pointer-events:auto; }
    .process-detail h3 { font-size:clamp(27px,3vw,38px); letter-spacing:-1px; margin:13px 0 12px; }
    .process-detail p { color:var(--muted); font-size:15px; max-width:430px; }
    .process-detail .deliver { max-width:400px; }
    .process-progress { height:3px; width:100%; background:#d9e4df; margin-top:18px; overflow:hidden; }
    .progress-fill { display:block; width:0; height:100%; background:var(--accent); }
    .process-counter { display:flex; justify-content:space-between; color:#8b9c98; font:700 11px Manrope,sans-serif; letter-spacing:1.5px; margin-top:12px; }
    .process-counter span:first-child { color:var(--accent-dark); }
    .process-art { min-width:0; position:relative; padding:22px; border:1px solid #dce7e1; border-radius:18px; background:#f8faf8; box-shadow:0 25px 70px rgba(25,65,54,.07); }
    .process-art svg { width:100%; max-height:470px; display:block; }
    .art-topline,.art-footer { display:flex; justify-content:space-between; gap:15px; color:#7b9690; font:700 9px Manrope,sans-serif; letter-spacing:1.3px; }
    .art-topline { padding:0 2px 12px; border-bottom:1px solid #e4ece7; }
    .art-footer { padding:12px 2px 0; border-top:1px solid #e4ece7; }
    .stage-line { opacity:0; stroke-dasharray:1; stroke-dashoffset:1; }
    .scan-point { animation:pulsePoint 2s ease-in-out infinite; }
    @keyframes pulsePoint { 50% { opacity:.35; transform:scale(1.5); } }
    .contact { background:var(--navy); color:#fff; padding:88px 0; }
    .contact-inner { display:flex; align-items:center; justify-content:space-between; gap:40px; }
    .contact h2 { font-size:clamp(36px,5vw,58px); max-width:650px; }
    .contact p { color:#b6c9ce; margin-top:15px; max-width:530px; }
    .contact .button { background:#fff; color:var(--navy); white-space:nowrap; }
    .contact .button:hover { background:#e4f3ef; }
    footer { background:#0c2430; color:#a9bdc3; padding:25px 0; font-size:13px; }
    .footer-inner { display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap; }
    footer a:hover { color:#fff; }
    .reveal { opacity:0; transform:translateY(18px); transition:opacity .65s ease,transform .65s ease; }
    .reveal.visible { opacity:1; transform:none; }

    /* Camada de acabamento premium e microinterações */
    .scroll-progress { position:fixed; z-index:50; inset:0 auto auto 0; width:100%; height:3px; pointer-events:none; }
    .scroll-progress span { display:block; width:0; height:100%; background:var(--accent); box-shadow:0 0 14px rgba(21,155,142,.45); }
    nav { transition:box-shadow .3s, background .3s, transform .3s; }
    nav.scrolled { background:rgba(255,255,255,.96); box-shadow:0 14px 40px rgba(16,45,59,.10); }
    .nav-links a { position:relative; }
    .nav-links a:after { content:""; position:absolute; left:0; right:100%; bottom:-8px; height:2px; background:var(--accent); transition:right .25s; }
    .nav-links a:hover:after,.nav-links a.active:after { right:0; }
    .service { position:relative; transform-style:preserve-3d; will-change:transform; overflow:hidden; }
    .service:before { content:""; position:absolute; width:180px; height:180px; right:-100px; top:-100px; border:1px solid rgba(21,155,142,.16); border-radius:50%; transition:transform .5s,background .5s; }
    .service:hover:before { transform:scale(1.8); background:rgba(21,155,142,.035); }
    .service-number,.service h3,.service p { position:relative; z-index:1; }
    .service h3 { transition:color .25s; }
    .service:hover h3 { color:var(--accent-dark); }
    .service:after { content:"↗"; position:absolute; right:22px; bottom:20px; color:var(--accent); opacity:0; transform:translate(-5px,5px); transition:.25s; }
    .service:hover:after { opacity:1; transform:none; }
    .why-item { transition:padding-left .25s,border-color .25s; }
    .why-item:hover { padding-left:12px; border-color:var(--accent); }
    .planner { background:#fff; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .planner-grid { display:grid; grid-template-columns:.9fr 1.1fr; gap:65px; align-items:center; }
    .planner-panel { padding:30px; border:1px solid var(--line); border-radius:22px; background:var(--bg); box-shadow:0 24px 70px rgba(16,45,59,.07); }
    .planner-panel label { display:block; color:var(--ink); font-size:12px; font-weight:800; margin:18px 0 8px; letter-spacing:.3px; }
    .planner-panel select,.planner-panel input { width:100%; border:1px solid #dce6e1; background:#fff; color:var(--ink); border-radius:10px; padding:14px 13px; font:500 14px "DM Sans",sans-serif; outline:none; transition:border .2s,box-shadow .2s; }
    .planner-panel select:focus,.planner-panel input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(21,155,142,.12); }
    .planner-result { margin-top:22px; padding:18px; border-radius:13px; background:#eaf3ef; }
    .planner-result small { display:block; color:var(--accent-dark); font-size:10px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; }
    .planner-result strong { display:block; font:700 19px Manrope,sans-serif; margin-top:5px; }
    .planner-result p { color:var(--muted); font-size:13px; margin-top:6px; }
    .planner-panel .button { width:100%; margin-top:16px; border:0; cursor:pointer; }
    .planner-note { color:var(--muted); font-size:11px; margin-top:12px; }
    .faq { background:#eef3f0; }
    .faq-grid { display:grid; grid-template-columns:.8fr 1.2fr; gap:70px; align-items:start; }
    .faq-list { border-top:1px solid #d6e1dc; }
    .faq-item { border-bottom:1px solid #d6e1dc; }
    .faq-question { width:100%; display:flex; justify-content:space-between; align-items:center; gap:20px; padding:22px 0; border:0; background:none; color:var(--ink); text-align:left; cursor:pointer; font:700 16px Manrope,sans-serif; }
    .faq-question span:last-child { color:var(--accent); font-size:23px; transition:transform .25s; }
    .faq-answer { display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s; }
    .faq-answer > div { overflow:hidden; }
    .faq-answer p { color:var(--muted); font-size:14px; padding:0 35px 0 0; }
    .faq-item.open .faq-answer { grid-template-rows:1fr; }
    .faq-item.open .faq-answer p { padding-bottom:22px; }
    .faq-item.open .faq-question span:last-child { transform:rotate(45deg); }
    .floating-contact { position:fixed; z-index:30; right:24px; bottom:24px; width:56px; height:56px; display:grid; place-items:center; border-radius:50%; color:#fff; background:#159b8e; box-shadow:0 12px 30px rgba(8,121,111,.28); transition:transform .25s,box-shadow .25s; }
    .floating-contact:hover { transform:translateY(-5px) scale(1.04); box-shadow:0 17px 35px rgba(8,121,111,.35); }
    .floating-contact svg { width:25px; height:25px; fill:currentColor; }
    .back-top { position:fixed; z-index:29; right:31px; bottom:92px; width:42px; height:42px; border:1px solid var(--line); border-radius:50%; background:#fff; color:var(--ink); cursor:pointer; opacity:0; pointer-events:none; transform:translateY(10px); transition:.25s; box-shadow:0 8px 24px rgba(16,45,59,.08); }
    .back-top.show { opacity:1; pointer-events:auto; transform:none; }
    .cursor-glow { position:fixed; z-index:0; width:260px; height:260px; border-radius:50%; pointer-events:none; background:radial-gradient(circle,rgba(21,155,142,.07),transparent 68%); transform:translate(-50%,-50%); opacity:0; }
    .contact { position:relative; overflow:hidden; }
    .contact:after { content:""; position:absolute; width:460px; height:460px; right:-150px; top:-230px; border:1px solid rgba(255,255,255,.12); border-radius:50%; box-shadow:0 0 0 45px rgba(255,255,255,.025),0 0 0 90px rgba(255,255,255,.02); pointer-events:none; }
    .contact-inner { position:relative; z-index:1; }
    @media(min-width:681px) {
      .cursor-glow { opacity:1; }
      .planner-panel { transition:transform .3s,box-shadow .3s; }
      .planner-panel:hover { transform:translateY(-4px); box-shadow:0 30px 80px rgba(16,45,59,.11); }
    }
    @media(max-width:900px) {
      .planner-grid,.faq-grid { grid-template-columns:1fr; gap:35px; }
    }
    @media(max-width:680px) {
      .floating-contact { right:16px; bottom:16px; width:52px; height:52px; }
      .back-top { right:21px; bottom:80px; }
      .planner-panel { padding:22px 18px; }
      .faq-grid { gap:28px; }
      .faq-question { font-size:14px; }
      .cursor-glow { display:none; }
    }

    @media(max-width:900px) {
      .hero-grid { gap:35px; grid-template-columns:1fr  .85fr; }
      .services { grid-template-columns:repeat(2,1fr); }
      .process-layout { gap:30px; grid-template-columns:.9fr 1.1fr; }
      .process-art { padding:16px; }
      .process-art svg { max-height:400px; }
      .process-step:nth-child(3):after { display:none; }
      .process-step p { min-height:70px; }
    }
    @media(max-width:680px) {
      html { scroll-padding-top:82px; }
      .container { width:min(100% - 32px,var(--max)); }
      .topbar { inset:8px 0 auto; }
      nav { position:relative; width:calc(100% - 20px); min-height:58px; padding:7px 8px 7px 12px; gap:8px; }
      .brand { font-size:15px; gap:7px; }
      .brand img { width:30px!important; height:30px!important; }
      .nav-links {
        display:none; position:absolute; top:calc(100% + 8px); left:0; right:0;
        padding:9px; flex-direction:column; align-items:stretch; gap:0;
        border:1px solid var(--line); border-radius:13px; background:#fff;
        box-shadow:0 16px 36px rgba(16,45,59,.14);
      }
      .nav-links.open { display:flex; }
      .nav-links a { padding:12px 10px; font-size:14px; border-radius:8px; }
      .nav-links a:after { display:none; }
      .nav-links a:hover,.nav-links a.active { background:#edf6f2; }
      nav .button { padding:10px 11px; font-size:10px; white-space:nowrap; }
      .mobile-menu-toggle {
        display:grid; place-items:center; flex:0 0 37px; width:37px; height:37px;
        border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink);
        font-size:19px; line-height:1; cursor:pointer;
      }

      /* Hero: todo o conteúdo principal cabe na primeira tela do celular. */
      .hero { height:180svh; min-height:0; }
      .hero-grid {
        height:100svh; min-height:100svh; padding-top:76px; padding-bottom:12px;
        grid-template-columns:1fr; grid-template-rows:auto minmax(145px,27svh);
        gap:10px; align-content:center;
      }
      .hero-copy-block { min-width:0; }
      .eyebrow { font-size:9px; letter-spacing:1.2px; margin-bottom:10px; gap:7px; }
      .eyebrow:before { width:18px; }
      h1 { font-size:clamp(34px,10vw,50px); line-height:1.02; letter-spacing:-1.5px; }
      .hero-copy { font-size:12px; line-height:1.45; margin:10px 0 13px; }
      .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .actions .button { min-width:0; padding:10px 8px; font-size:10px; text-align:center; }
      .hero-visual { min-height:145px; height:27svh; max-height:205px; border-radius:16px; }
      .hero-visual:before { width:230px; height:230px; }
      .hero-visual:after { width:175px; height:175px; }
      .house { width:min(65%,260px); max-height:90%; }
      .visual-label { left:12px; bottom:10px; font-size:7px; letter-spacing:.7px; }
      .blueprint-tag { top:10px; right:11px; font-size:7px; letter-spacing:.8px; }
      .scroll-caption { display:none; }

      .section { padding:68px 0; }
      .section-head h2 { font-size:clamp(31px,8.5vw,44px); line-height:1.08; }
      .section-head>p:last-child { font-size:13px; line-height:1.6; }
      .services { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:28px; }
      .service { min-width:0; min-height:190px; padding:17px 13px; }
      .service h3 { font-size:17px; margin:19px 0 8px; }
      .service p { font-size:12px; line-height:1.5; }
      .why-grid { grid-template-columns:1fr; gap:26px; }
      .why-list { gap:19px; }
      .planner-grid,.faq-grid { grid-template-columns:1fr; gap:28px; }
      .planner-panel { padding:22px 17px; }
      .faq-question { font-size:14px; }

      /* Processo: mantém o painel sticky e troca as etapas conforme o scroll. */
      .process-scroll { height:500svh; min-height:0; }
      .process-sticky { position:sticky; top:0; height:100svh; min-height:100svh; padding:68px 0 10px; overflow:hidden; }
      .process-layout {
        height:100%; display:grid; grid-template-columns:1fr;
        grid-template-rows:minmax(0,1fr) auto; gap:8px;
        padding-top:0; padding-bottom:0; align-items:stretch;
      }
      .process-content { min-height:0; display:flex; flex-direction:column; justify-content:center; }
      .process-content .section-head .eyebrow { margin-bottom:7px; }
      .process-content .section-head h2 { font-size:clamp(27px,7.5vw,36px); line-height:1.04; }

        <section class="contact" id="contato"><div class="container contact-inner"><div class="reveal"><h2>${escapeHTML(c.title)}</h2><p>${escapeHTML(c.description)}</p></div><a class="button reveal" href="${wa(s.whatsapp)}" target="_blank" rel="noopener">${escapeHTML(c.cta)} ↗</a></div></section>

      <footer><div class="container footer-inner"><span>© ${escapeHTML(s.year)} ${escapeHTML(s.company)}. Todos os direitos reservados.</span><a href="${escapeHTML(s.instagramUrl)}" target="_blank" rel="noopener">${escapeHTML(s.instagramLabel)}</a></div></footer>`;
    initInteractions(d);
  }
  function initInteractions(d) {
    const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const revealItems=document.querySelectorAll(".reveal");
    if("IntersectionObserver" in window && !reduceMotion){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("visible");observer.unobserve(entry.target);}}),{threshold:.12});revealItems.forEach(item=>observer.observe(item));}else revealItems.forEach(item=>item.classList.add("visible"));
    const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v)), smooth=v=>{const t=clamp(v);return t*t*(3-2*t);};
    const hero=document.querySelector(".hero"),heroLines=[...document.querySelectorAll("#heroDrawing .draw-line")],heroFill=document.querySelector("#heroDrawing .draw-fill"),processSection=document.querySelector(".process-scroll"),processLines=[...document.querySelectorAll("#processDrawing .stage-line")],details=[...document.querySelectorAll(".process-detail")],progressFill=document.querySelector(".progress-fill"),processCount=document.querySelector("#processCount"),artStatus=document.querySelector("#artStatus"),drawingCaption=document.querySelector("#drawingCaption");

      const hp=sectionProgress(hero),heroReveal=smooth(hp/.78);

      const heroVisual=document.querySelector(".hero-visual");
      if(heroVisual && !window.matchMedia("(max-width:680px)").matches){

      }

      const processProgress=sectionProgress(processSection);
      const scaled=processProgress*d.process.steps.length;
      const active=Math.min(d.process.steps.length-1,Math.floor(scaled));
      details.forEach((item,i)=>item.classList.toggle("active",i===active));
      processCount.textContent=String(active+1).padStart(2,"0");
      artStatus.textContent=d.process.statuses[active];
      drawingCaption.textContent=d.process.captions[active];
      progressFill.style.width=`${processProgress*100}%`;
      processLines.forEach(line=>{
        const stage=Number(line.dataset.stage);
        const amount=smooth(clamp(scaled-stage+.18));
        line.style.strokeDashoffset=String(1-amount);
        line.style.opacity=String(amount);

    }

      processLines.forEach(line=>{line.style.strokeDashoffset="0";line.style.opacity="1";});
    }else{

    }
    const siteProgress=document.querySelector("#siteProgress"),backTop=document.querySelector("#backTop"),nav=document.querySelector("nav"),navLinks=[...document.querySelectorAll(".nav-links a")],sectionTargets=["servicos","processo","planejamento","contato","duvidas"].map(id=>document.getElementById(id)).filter(Boolean);
    const mobileMenuToggle=document.getElementById("mobileMenuToggle"),mobileNav=document.querySelector(".nav-links");

    function updateChrome(){const max=document.documentElement.scrollHeight-window.innerHeight;siteProgress.style.width=`${max>0?window.scrollY/max*100:0}%`;nav.classList.toggle("scrolled",window.scrollY>25);backTop.classList.toggle("show",window.scrollY>600);let current="";sectionTargets.forEach(section=>{if(section.getBoundingClientRect().top<window.innerHeight*.42)current=section.id;});navLinks.forEach(link=>link.classList.toggle("active",link.getAttribute("href")===`#${current}`));}
    window.addEventListener("scroll",updateChrome,{passive:true});window.addEventListener("resize",updateChrome);updateChrome();backTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:reduceMotion?"auto":"smooth"}));
    const fields=d.planner.fields.map(field=>document.getElementById(field.id)),title=document.getElementById("plannerTitle"),description=document.getElementById("plannerDescription");
    function updatePlanner(){title.textContent=fields[0].value;description.textContent=`${fields[1].value} · ${fields[2].value}. ${d.planner.resultDescription}`;}
    fields.forEach(field=>field.addEventListener("change",updatePlanner));
    document.getElementById("plannerSend").addEventListener("click",()=>{const message=[d.planner.messageIntro,`Objetivo: ${fields[0].value}.`,`Porte: ${fields[1].value}.`,`Etapa atual: ${fields[2].value}.`,d.planner.messageClosing].join("\n");window.open(`${wa(d.site.whatsapp)}&text=${encodeURIComponent(message)}`,"_blank","noopener");});
    document.querySelectorAll(".faq-question").forEach(button=>button.addEventListener("click",()=>{const item=button.closest(".faq-item"),open=!item.classList.contains("open");document.querySelectorAll(".faq-item").forEach(other=>{other.classList.remove("open");other.querySelector(".faq-question").setAttribute("aria-expanded","false");});if(open){item.classList.add("open");button.setAttribute("aria-expanded","true");}}));
    if(window.matchMedia("(hover:hover) and (pointer:fine)").matches&&!reduceMotion){document.querySelectorAll(".service").forEach(card=>{card.addEventListener("pointermove",event=>{const rect=card.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5;card.style.transform=`perspective(800px) rotateX(${y*-3}deg) rotateY(${x*3}deg) translateY(-5px)`;});card.addEventListener("pointerleave",()=>card.style.transform="");});const glow=document.querySelector("#cursorGlow");window.addEventListener("pointermove",event=>{glow.style.left=`${event.clientX}px`;glow.style.top=`${event.clientY}px`;},{passive:true});}
  }
  fetch("./data.json").then(response=>{if(!response.ok)throw new Error("Não foi possível carregar data.json");return response.json();}).then(renderSite).catch(error=>{document.getElementById("app").innerHTML=`<main class="container" style="padding:140px 0"><h1>Não foi possível carregar o conteúdo.</h1><p>Verifique se o arquivo <strong>data.json</strong> está na mesma pasta que o index.html e se o site está sendo servido por um servidor local ou hospedagem.</p><p>${escapeHTML(error.message)}</p></main>`;});
  </script>
